<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>
    <link rel="stylesheet" href="user-account.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="container">

        <div class="myaccount-header">
            <h1>My Account</h1>

            <a href="index.html">Back to Dashboard</a>
        </div>

        <div class="myaccount-profile">
            
            <div class="profile-image">
                <img src="images/default-profile.png" alt="Profile Picture">
            </div>

            <div class="profile-details">
                <h3>username</h3>
                <h3>email address</h3>
            </div>

        </div>

        <div class="content">

            <h2>ACCOUNT ACTIONS</h2>
            <p>Logging out will return you to the sign-in page.</p>

            <a class="log-out-btn" href="#">Log Out</a>
            <a class="delete-account-btn" href="#">Delete Account</a>
        </div>

    </div>


    <script src="user-account.js"></script>

</body>
</html>
