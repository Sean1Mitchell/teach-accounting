<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up</title>
    <link rel="stylesheet" href="sign-up-page.css">
</head>
<body>

    <div class="container">
        
        <div class="signin-header">
            <h1>Sign Up</h1>
        </div>

        <div class="content">
            <div class="form-group-first-name">
                <input type="text" id="first-name" name="first-name" required placeholder="First Name">
            </div>
            <div class="form-group-last-name">
                <input type="text" id="last-name" name="last-name" required placeholder="Last Name">
            </div>
            <div class="form-group-DOB">
                <input type="text" id="date-of-birth" name="date-of-birth" required placeholder="DOB: DD/MM/YY">
            </div>
            <div class="form-group-email">
                <input type="email" id="email" name="email" required placeholder="Email Address">
            </div>
            <div class="form-group-password">
                <input type="password" id="password" name="password" required placeholder="Password">
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </div>

        <div class="other">
            <div class="sign-in">
                <p>Already have an account? <a href="sign-in-page.html">Sign In</a></p>
            </div>
        </div>
    
    </div>

    <script src="sign-up-page.js"></script>

</body>
</html>
